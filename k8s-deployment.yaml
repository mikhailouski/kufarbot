apiVersion: apps/v1
kind: Deployment
metadata:
  name: kufarbot
  namespace: lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kufarbot
  template:
    metadata:
      labels:
        app: kufarbot
    spec:
      containers:
        - name: kufarbot
          image: ghcr.io/mikhailouski/kufarbot:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "main.py"]
          envFrom:
            - secretRef:
                name: kufarbot-secret
            - configMapRef:
                name: kufarbot-config
          volumeMounts:
            - name: bot-data
              mountPath: /app/data
      volumes:
        - name: bot-data
          hostPath:
            path: /opt/kufarbot/data
            type: Directory
