name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-push

    runs-on: [self-hosted, linux, x64, kufarbot]

    steps:
      - name: Deploy application
        shell: bash
        run: |
          set -e

          cd /opt/kufarbot

          NEW_TAG="sha-${GITHUB_SHA}"

          echo "New image:"
          echo "ghcr.io/mikhailouski/kufarbot:${NEW_TAG}"

          # Save currently running version for rollback
          PREVIOUS_IMAGE=$(docker inspect kufarbot \
            --format '{{.Config.Image}}' 2>/dev/null || true)

          if [ -n "$PREVIOUS_IMAGE" ]; then
            PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
            echo "Previous image: ${PREVIOUS_IMAGE}"
            echo "Previous tag: ${PREVIOUS_TAG}"
          else
            PREVIOUS_TAG=""
            echo "No previous container found."
          fi

          export IMAGE_TAG="${NEW_TAG}"

          echo "Pulling new image..."
          docker pull "ghcr.io/mikhailouski/kufarbot:${NEW_TAG}"

          echo "Starting new version..."
          docker compose up -d --force-recreate

          echo "Waiting for healthcheck..."

          HEALTHY=false

          for i in $(seq 1 12); do
            STATUS=$(docker inspect kufarbot \
              --format '{{.State.Health.Status}}')

            echo "Health status: ${STATUS}"

            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" = true ]; then
            echo "Deployment successful."
            exit 0
          fi

          echo "Deployment failed."
          echo "Container logs:"
          docker compose logs --tail=50

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous version available for rollback."
            exit 1
          fi

          echo "Starting rollback to: ${PREVIOUS_TAG}"

          export IMAGE_TAG="${PREVIOUS_TAG}"

          docker pull "ghcr.io/mikhailouski/kufarbot:${PREVIOUS_TAG}"
          docker compose up -d --force-recreate

          echo "Waiting for rollback healthcheck..."

          ROLLBACK_HEALTHY=false

          for i in $(seq 1 12); do
            STATUS=$(docker inspect kufarbot \
              --format '{{.State.Health.Status}}')

            echo "Rollback health status: ${STATUS}"

            if [ "$STATUS" = "healthy" ]; then
              ROLLBACK_HEALTHY=true
              break
            fi

            sleep 5
          done

          if [ "$ROLLBACK_HEALTHY" = true ]; then
            echo "Rollback successful."
          else
            echo "Rollback failed!"
          fi

          exit 1

      - name: Show container status
        if: always()
        run: |
          cd /opt/kufarbot
          docker compose ps

      - name: Show deployed image
        if: always()
        run: |
          docker inspect kufarbot \
            --format 'Container image: {{.Config.Image}}'

          docker inspect kufarbot \
            --format 'Image ID: {{.Image}}'

          docker inspect kufarbot \
            --format 'Health: {{.State.Health.Status}}'

      - name: Show logs
        if: always()
        run: |
          cd /opt/kufarbot
          docker compose logs --tail=50