name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-push

    runs-on: [self-hosted, linux, x64, kufarbot]

    steps:
      - name: Deploy application
        run: |
          cd /opt/kufarbot

          export IMAGE_TAG="sha-${GITHUB_SHA}"

          echo "Deploying image:"
          echo "ghcr.io/mikhailouski/kufarbot:${IMAGE_TAG}"

          docker pull "ghcr.io/mikhailouski/kufarbot:${IMAGE_TAG}"
          docker compose up -d --force-recreate

      - name: Show container status
        run: |
          cd /opt/kufarbot
          docker compose ps

      - name: Show deployed image
        run: |
          docker inspect kufarbot \
            --format 'Container image: {{.Config.Image}}'

          docker inspect kufarbot \
            --format 'Image ID: {{.Image}}'

      - name: Show logs
        run: |
          cd /opt/kufarbot
          docker compose logs --tail=30